# Copy to wrangler.toml (git-ignored) and put in the id of your own D1
# database (`npx wrangler d1 create <name>` prints it). The published
# project's own file is kept out of the repository.
# Cloudflare Pages: the published site (direct upload from dist/) and, beside
# it, the archive: Pages Functions in functions/ (POST /api/generations and
# /admin) with one D1 database. The project name is only the address
# (kotoba-no-katachi.pages.dev). This file is the source of truth for the
# project's bindings; the admin secrets are set with `wrangler pages secret put`
# (see docs/archive.md), never here.
name = "kotoba-no-katachi"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-22"

[[d1_databases]]
binding = "DB"
database_name = "kotoba-no-katachi-archive"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
