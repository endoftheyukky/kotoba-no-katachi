<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>具体詩</title>
    <meta
      name="description"
      content="入力された言葉を、意味だけでなく、文字・音・反復・欠落・包含・語の継ぎ目など、機械が測ることのできる性質として読み、一枚の紙面の上の関係へ置き換える。"
    />
    <meta name="theme-color" content="#f2f2f0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="具体詩" />
    <meta
      property="og:description"
      content="言葉を、文字・音・反復・欠落・包含・語の継ぎ目として読み、一枚の紙面へ。"
    />
    <meta property="og:image" content="/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body data-state="idle">
    <main id="stage"></main>

    <form id="entry" autocomplete="off">
      <label class="hidden" for="title">題</label>
      <input id="title" lang="ja" maxlength="32" spellcheck="false" placeholder="題" enterkeyhint="go" />
      <label class="hidden" for="reading">よみ（任意）</label>
      <input id="reading" lang="ja" maxlength="40" spellcheck="false" placeholder="よみ（任意）" enterkeyhint="go" />
      <button type="submit" id="go" aria-label="紙面をつくる">→</button>
      <button type="button" id="save" aria-label="PNGで保存">PNG</button>
    </form>
    <p id="note" role="status" aria-live="polite"></p>

    <button type="button" id="about-open" aria-haspopup="dialog">この作品について</button>
    <dialog id="about" aria-labelledby="about-title">
      <h1 id="about-title">具体詩</h1>
      <p>
        入力された言葉を、意味だけでなく、文字・音・反復・欠落・包含・語の継ぎ目・順序といった、機械が測ることのできる性質として読み、一枚の紙面の上の関係へ置き換えます。
      </p>
      <p>同じ題からは、いつも同じ一枚が生まれます。よみを添えると音の読みが変わり、紙面が変わることがあります。</p>
      <p>題は一語から短い句まで、十六字まで。</p>
      <dl>
        <dt>字体</dt>
        <dd>Noto Sans JP・Noto Serif JP（SIL Open Font License 1.1）</dd>
        <dt>制作</dt>
        <dd>Yuki Sunaga</dd>
      </dl>
      <form method="dialog"><button type="submit">閉じる</button></form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
